# Codemagic CI — build iOS + upload para o App Store Connect.
#
# Pós-migração Azure (07/2026): repo conectado via "Other"
# (dev.azure.com/smartcafe/wizmart/_git/wizmart-qualidade-app, PAT
# somente-leitura). App Codemagic: 6a6d4442a9039d6a17c067a2.
#
# SEM triggers automáticos — regra do projeto: publicação iOS somente
# mediante solicitação do Alan. Build disparado via API
# (POST https://api.codemagic.io/builds, workflowId: ios-testflight).
#
# Pré-requisitos no Codemagic (conta alanclaudiolang@gmail.com):
#   1. Integração "App Store Connect" com nome `app_store_connect`
#      (criada em 05/2026 — Issuer ID + Key .p8 da Apple).
#   2. Variável secreta CERT_PRIVATE_KEY no grupo `ios-signing`
#      (chave privada do certificado de distribuição; recriada em
#      08/2026 — a anterior ficou inacessível no app antigo do GitHub).

workflows:
  ios-testflight:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - ios-signing
      vars:
        BUNDLE_ID: com.wizmart.promotor
        APP_STORE_APPLE_ID: 6774250898
        # CFBundleVersion (precisa ser MAIOR que o último build enviado
        # ao App Store Connect — histórico foi até 23). Alinhado ao
        # BUILD_NUMBER do Android (azure-pipelines.yml) por clareza.
        IOS_BUILD_NUMBER: "269"
      flutter: 3.44.6
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: app_store_connect

    scripts:
      - name: Inicializar keychain
        script: |
          keychain initialize

      - name: Buscar/criar signing files (auto-create na 1ª execução)
        # `--create` cria o cert e o profile via App Store Connect API
        # se ainda não existirem. Requer API key Admin.
        #
        # A private key vem de CERT_PRIVATE_KEY (env var persistente no
        # grupo ios-signing) — gerar nova a cada build não funciona porque
        # Apple limita certs DISTRIBUTION por time, e cada cert é casado
        # com UMA private key específica. Persistir a key garante que
        # builds subsequentes encontram o cert existente e reusam.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERT_PRIVATE_KEY

      - name: Aplicar profiles no Xcode project
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter packages
        script: |
          flutter packages pub get

      - name: Gerar código Drift
        script: |
          dart run build_runner build --delete-conflicting-outputs

      - name: Instalar pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Computar metadados do build
        script: |
          export TZ=America/Sao_Paulo
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d ' \r\n')
          BUILD_TIME=$(date +'%d/%m/%Y %H:%M')
          echo "APP_VERSION=$VERSION" >> $CM_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $CM_ENV
          echo "Versão: $VERSION | Build: $IOS_BUILD_NUMBER | Time: $BUILD_TIME (BRT)"

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$APP_VERSION \
            --build-number=$IOS_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=BUILD_TIME="$BUILD_TIME" \
            --dart-define=BUILD_NUMBER="$IOS_BUILD_NUMBER"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # O upload vai para o App Store Connect; a criação da versão
        # 1.0.2, anexação do build e envio para análise são feitos via
        # API (App Store Connect API) — sem TestFlight (decisão do Alan
        # em 01/08/2026: sem teste no iPhone, direto para produção,
        # como foi feito no Android).
        submit_to_testflight: false
