# Build Android assinado (APK) — WizMart Promotor
#
# Usa a keystore do Secure Files (wizmart-upload-2026.jks) e as senhas do
# variable group `android-signing`. Disparo MANUAL somente (trigger: none)
# — regra do projeto: publicar exige OK explícito do Alan a cada vez.
#
# Parâmetros do build (versão/numeração) ficam nas variáveis abaixo.

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: android-signing
  - group: supabase-distribution
  - name: APP_VERSION
    value: '1.0.2'
  - name: BUILD_NUMBER
    value: '266'
  # true → atualização obrigatória IMEDIATA nos apps (latest.json).
  # false → obrigatória só no dia seguinte (regra D+1 do app).
  - name: FORCE_UPDATE
    value: 'false'
  # Preencher com a URL da ficha na Play quando o app for APROVADO
  # (ex.: https://play.google.com/store/apps/details?id=com.wizmart.wizmart_app)
  # → o botão Atualizar dos builds 266+ passa a abrir a LOJA em vez de
  # baixar APK (interruptor remoto via latest.json; exigência de política
  # do Google Play). Vazio = comportamento atual (baixa APK da URL fixa).
  - name: PLAY_STORE_URL
    value: ''
  - name: FLUTTER_URL
    value: 'https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.6-stable.tar.xz'

steps:
  - task: DownloadSecureFile@1
    name: keystore
    displayName: 'Keystore do Secure Files'
    inputs:
      secureFile: 'wizmart-upload-2026.jks'

  - script: |
      set -e
      curl -sSL -o /tmp/flutter.tar.xz "$(FLUTTER_URL)"
      tar xf /tmp/flutter.tar.xz -C $(Agent.ToolsDirectory)
      echo "##vso[task.prependpath]$(Agent.ToolsDirectory)/flutter/bin"
    displayName: 'Instalar Flutter'

  - script: |
      set -e
      flutter --version
      BUILD_TIME=`date -u -d '-3 hours' +'%d/%m/%Y %H:%M'`
      echo "APP_VERSION=$(APP_VERSION) BUILD_NUMBER=$(BUILD_NUMBER) BUILD_TIME=$BUILD_TIME (BRT)"
      # --build-number grava o BUILD_NUMBER como versionCode do Android
      # (exigência da Play Store: cada envio precisa de versionCode maior;
      # também deixa o update por cima do sideload sempre "para frente").
      flutter build apk --release \
        --build-name="$(APP_VERSION)" --build-number="$(BUILD_NUMBER)" \
        --dart-define=APP_VERSION="$(APP_VERSION)" \
        --dart-define=BUILD_TIME="$BUILD_TIME" \
        --dart-define=BUILD_NUMBER="$(BUILD_NUMBER)"
      # AAB para a Play Store (mesma assinatura/dart-defines)
      flutter build appbundle --release \
        --build-name="$(APP_VERSION)" --build-number="$(BUILD_NUMBER)" \
        --dart-define=APP_VERSION="$(APP_VERSION)" \
        --dart-define=BUILD_TIME="$BUILD_TIME" \
        --dart-define=BUILD_NUMBER="$(BUILD_NUMBER)"
    displayName: 'Build APK release assinado'
    env:
      UPLOAD_KEYSTORE_PATH: $(keystore.secureFilePath)
      UPLOAD_KEY_ALIAS: $(UPLOAD_KEY_ALIAS)
      UPLOAD_KEYSTORE_PASSWORD: $(UPLOAD_KEYSTORE_PASSWORD)
      UPLOAD_KEY_PASSWORD: $(UPLOAD_KEY_PASSWORD)

  - script: |
      set -e
      APK=build/app/outputs/flutter-apk/app-release.apk
      ls -la $APK
      $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs $APK | head -4 || true
      sha256sum $APK
    displayName: 'Verificar assinatura e hash'

  - publish: build/app/outputs/flutter-apk/app-release.apk
    artifact: apk
    displayName: 'Publicar artefato'

  - publish: build/app/outputs/bundle/release/app-release.aab
    artifact: aab
    displayName: 'Publicar artefato AAB (Play Store)'

  # Publica no Supabase Storage (bucket Arquivos/versoes-apk):
  #   1. APK versionado (histórico, imutável por convenção)
  #   2. APK na URL FIXA (o link do site — sobrescrito a cada build)
  #   3. latest.json (dispara o auto-update dentro do app, build 264+)
  - script: |
      set -e
      APK=build/app/outputs/flutter-apk/app-release.apk
      BASE="$SUPABASE_URL/storage/v1/object/Arquivos/versoes-apk"
      up() {
        curl -sS -f -X POST "$BASE/$1" \
          -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
          -H "apikey: $SUPABASE_SERVICE_KEY" \
          -H "x-upsert: true" -H "Content-Type: $2" \
          --data-binary @"$3" > /dev/null
        echo "OK: $1"
      }
      up "promotor-wizmart-v$(APP_VERSION)-build$(BUILD_NUMBER).apk" \
         "application/vnd.android.package-archive" "$APK"
      up "promotor-wizmart.apk" \
         "application/vnd.android.package-archive" "$APK"
      PUBAT=`date -u +%Y-%m-%dT%H:%M:%SZ`
      printf '{"buildNumber":"%s","apkUrl":"%s","forceUpdate":%s,"publishedAt":"%s","playStoreUrl":"%s"}' \
        "$(BUILD_NUMBER)" \
        "$SUPABASE_URL/storage/v1/object/public/Arquivos/versoes-apk/promotor-wizmart.apk?v=$(BUILD_NUMBER)" \
        "$(FORCE_UPDATE)" "$PUBAT" "$(PLAY_STORE_URL)" > /tmp/latest.json
      cat /tmp/latest.json; echo ""
      up "latest.json" "application/json" /tmp/latest.json
    displayName: 'Publicar no Supabase (APK fixo + latest.json)'
    env:
      SUPABASE_URL: $(SUPABASE_URL)
      SUPABASE_SERVICE_KEY: $(SUPABASE_SERVICE_KEY)
